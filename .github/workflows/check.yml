name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check (zsh -n)
        run: |
          status=0
          for f in .zshenv .zshrc *.zsh; do
            if zsh -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::zsh syntax error"
              status=1
            fi
          done
          exit $status
